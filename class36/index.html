<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX" crossorigin="anonymous">
        <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>


    <link rel="stylesheet" href="style.css">
</head>

<body>
    <nav class="navbar  navbar-expand-lg bgColor">
        <div class="container-fluid">
            <a class="navbar-brand text-light" href="#">SIT Post App</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false"
                aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">

                <form class="d-flex ms-auto" role="search">
                    <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search" />
                    <button class="btn btn-light" type="submit">Search</button>
                </form>
            </div>
        </div>
    </nav>
    <div class="container">
        <div class="row ">
            <div class="col-12 col-md-5 col-lg-4 mt-2">
                <div class="card p-3">
                    <div class="mb-3">
                        <label for="exampleFormControlInput1" class="form-label">Title</label>
                        <input type="text" class="form-control" id="title" placeholder="Enter your Title here:">
                    </div>
                    <div class="mb-3">
                        <label for="exampleFormControlTextarea1" class="form-label">Description</label>
                        <textarea class="form-control" id="desc" rows="3"
                            placeholder="What's On your mind..."></textarea>
                    </div>
                    <div class="d-flex mb-3 justify-content-between ">
                        <img class="bgImg selected" onclick="selectImg('./images/1.jpg')" src="./images/1.jpg" alt="">
                        <img class="bgImg" onclick="selectImg('./images/2.jpg')" src="./images/2.jpg" alt="">
                        <img class="bgImg" onclick="selectImg('./images/3.jpg')" src="./images/3.jpg" alt="">
                        <img class="bgImg" onclick="selectImg('./images/4.png')" src="./images/4.png" alt="">
                        <img class="bgImg" onclick="selectImg('./images/5.jpg')" src="./images/5.jpg" alt="">
                    </div>
                    <button class="btn bgColor text-light postBtn" onclick="post()">Post</button>
                </div>
            </div>
            <div class="col-12 col-md-7 col-lg-8" id="postContainer">
               
            </div>
        </div>
    </div>




    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-WyOxWvTyr1QaMPfiPJSv76iReVthorl5uWlFtZPyK0IEB0hGzo9y5Bp9mYanr8Bu"
        crossorigin="anonymous"></script>

    <script src="app.js"></script>
</body>

</html>
